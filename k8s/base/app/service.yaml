apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: go-observability-api
spec:
  type: ClusterIP # Expõe o serviço apenas dentro do cluster K8s
  selector:
    app: go-observability-api
  ports:
    - protocol: TCP
      port: 8080 # Porta que o Service expõe
      targetPort: 8080 # Porta que o Service direciona para os Pods (que a aplicação Go escuta)
