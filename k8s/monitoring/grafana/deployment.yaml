apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # Isola o Grafana no Worker 3
      nodeSelector:
        node-role: grafana-worker
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000

          # Limites de consumo para evitar que o Grafana derrube o nó
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Liveness: Verifica se o processo do Grafana não travou
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15 # O Grafana é mais pesado, damos 15s para arrancar
            periodSeconds: 10

          # Readiness: Verifica se o Grafana está pronto para apresentar os dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

          volumeMounts:
            - name: datasource-volume
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
      volumes:
        - name: datasource-volume
          configMap:
            name: grafana-datasource-config
