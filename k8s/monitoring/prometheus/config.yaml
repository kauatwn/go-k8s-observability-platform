apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s 
      evaluation_interval: 5s 

    scrape_configs:
      # Job para o Prometheus monitorar o próprio Prometheus
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Job para o Prometheus monitorar a API Go
      - job_name: 'go-api'
        static_configs:
          - targets: ['api:8080']
