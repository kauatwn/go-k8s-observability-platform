name: "Continuous Integration"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  go-lint:
    name: "Go: Lint, Vet & Vulncheck"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Go 🐹"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: "go.sum"

      - name: "Check Code Formatting (gofmt) 🎨"
        run: |
          if [[ -n $(gofmt -l .) ]]; then
            echo "Code is not formatted. Please run 'gofmt -w .' to format the code."
            exit 1
          fi

      - name: "Run Go Vet 🔍"
        run: go vet ./...

      - name: "Run Go Vulnerability Check (govulncheck) 🛡️"
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  k8s-lint:
    name: "Validate Kubernetes Manifests"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Go 🐹"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: "go.sum"

      - name: "Validate Kubernetes Manifests (Kubeconform & Kustomize) ☸️"
        # Kubeconform version: 0.8.0
        run: |
          echo "=== 1. Validating Base Manifests ==="
          go run github.com/yannh/kubeconform/cmd/kubeconform@02374e583d700721f57300fae78e11acd27ee539 \
            -summary \
            -schema-location default \
            -strict \
            -ignore-filename-pattern '.*kustomization\.yaml' \
            k8s/base/app/ k8s/base/monitoring/prometheus/ k8s/base/monitoring/grafana/

          echo "=== 2. Validating Dev Overlay Build & Schemas ==="
          kubectl kustomize k8s/overlays/dev | go run github.com/yannh/kubeconform/cmd/kubeconform@02374e583d700721f57300fae78e11acd27ee539 \
            -summary \
            -schema-location default \
            -strict

          echo "=== 3. Validating Prod Overlay Build & Schemas ==="
          kubectl kustomize k8s/overlays/prod | go run github.com/yannh/kubeconform/cmd/kubeconform@02374e583d700721f57300fae78e11acd27ee539 \
            -summary \
            -schema-location default \
            -strict

  go-build:
    name: "Go: Build Binary"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Go 🐹"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: "go.sum"

      - name: "Build Static Binary 🔨"
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/api ./cmd/api

      - name: "Upload Binary Artifacts 📤"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-linux-amd64
          path: bin/api
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: "Docker Build & Push to GHCR"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    needs: [go-lint, k8s-lint, go-build]

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Docker Buildx 🐳"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: "Login to GHCR 🔑"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and Push Docker Image 🚀"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=api-build
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=api-build' || '' }}
