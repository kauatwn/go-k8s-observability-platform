name: "Clean Old GHCR Images"

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  clean-ghcr:
    name: "Purge Untagged Container Images"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
      - name: "Delete untagged image versions 🧹"
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: "go-k8s-observability-platform"
          package-type: "container"
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
